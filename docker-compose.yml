services:
  neo4j:
    container_name: persona-neo4j
    image: neo4j:latest
    restart: always
    env_file:
      - .env
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - ./neo4j-data:/data
    networks:
      - persona-network
      - pyri_network
  
  app:
    container_name: persona-app
    build: .
    volumes:
      - ./persona:/app/persona
      - ./server:/app/server
      - ./tests:/app/tests
    env_file:
      - .env
    ports:
      - "8002:8000"
      - "5678:5678"  # debugpy port
    depends_on:
      - neo4j
    networks:
      - persona-network
      - pyri_network

  test:
    container_name: persona-test
    profiles: ["test"]  # Only start when explicitly requested
    build:
      context: .
      dockerfile: tests/Dockerfile.test
    volumes:
      - ./persona:/app/persona
      - ./server:/app/server
      - ./tests:/app/tests
    env_file:
      - .env
    depends_on:
      - neo4j
    networks:
      - persona-network

networks:
  persona-network:
    driver: bridge
  pyri_network:
    external: true